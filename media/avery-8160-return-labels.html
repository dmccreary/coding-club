<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avery 8160 Return Labels — Dan McCreary</title>
<style>
  /* ---------------------------------------------------------------
     Avery 8160 / 5160 geometry (US Letter, 8.5in x 11in)
       label size .......... 2.625in wide x 1in tall
       grid ................ 3 across x 10 down = 30 labels
       top/bottom margin ... 0.5in
       left/right margin ... 0.1875in
       column gutter ....... 0.125in   (0.1875*2 + 2.625*3 + 0.125*2 = 8.5in)
       row gutter .......... 0         (0.5*2 + 1*10 = 11in)
     Print at 100% scale / "Actual size", no headers or footers.
     --------------------------------------------------------------- */
  @page { size: 8.5in 11in; margin: 0; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 8.5in;
    height: 11in;
    padding: 0.5in 0.1875in;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(3, 2.625in);
    grid-template-rows: repeat(10, 1in);
    column-gap: 0.125in;
    row-gap: 0;
  }

  .label {
    width: 2.625in;
    height: 1in;
    box-sizing: border-box;
    padding: 0.08in 0.16in;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  .prompt {
    font-size: 7.5pt;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #333;
    line-height: 1.1;
    margin-bottom: 0.03in;
  }

  .name {
    font-size: 12pt;
    font-weight: 700;
    line-height: 1.15;
    color: #000;
  }

  .email {
    font-size: 9pt;
    line-height: 1.2;
    color: #000;
    word-break: break-all;
  }

  /* Screen-only alignment aid; never printed. */
  @media screen {
    body { background: #e9e9e9; padding: 24px 0; }
    .sheet { background: #fff; margin: 0 auto; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    .label { outline: 1px dashed #bbb; outline-offset: -1px; }
  }
  @media print {
    body { background: none; padding: 0; }
    .sheet { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="label"><div class="prompt">Please return to:</div><div class="name">Dan McCreary</div><div class="email">Dan.McCreary@gmail.com</div></div>
  </div>
<script>
  // Clone the first label out to the full 30-up sheet.
  const sheet = document.querySelector('.sheet');
  const first = sheet.querySelector('.label');
  for (let i = 1; i < 30; i++) sheet.appendChild(first.cloneNode(true));
</script>
</body>
</html>
