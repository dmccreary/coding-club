<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Coding Club Ecosystem Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Coding Club Ecosystem Map</div>


        <div class="right-panel">
            <div class="controls">
                <div class="stats">7 nodes &middot; 6 links</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
            <div class="legend-item">
                <div class="legend-color color-amber"></div>
                <span><strong>Coding club</strong></span>
            </div>
            <div class="legend-item">
                <div class="legend-color color-blue"></div>
                <span><strong>Related context</strong></span>
            </div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Node Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any circle to see what it means and how a coding club differs from it.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="coding-club-ecosystem-map.js"></script>
</body>
</html>
