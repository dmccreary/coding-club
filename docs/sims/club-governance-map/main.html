<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Club Governance at a Glance</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Club Governance at a Glance</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">7 roles · 4 tiers</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#5B7186"></span>Outside oversight</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>Leadership</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>Volunteers and mentors</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Participants and families</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Role Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any role to see what it is and its single most important responsibility.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="club-governance-map.js"></script>
</body>
</html>
