<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Mentor Matching and Schedule Optimizer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Mentor Matching and Schedule Optimizer</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">5 mentors · 5 students</div>
                <button class="btn" id="spotlight-btn">Best pairing</button>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>Mentor</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Student</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>Slot passing every constraint</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#D64545"></span>Slot failing at least one</div>
                <div class="legend-item"><span class="legend-color legend-note"></span>A thicker line is a higher shared-interest score</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Pairing and Slot Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click a mentor, a student, or a slot. Or press the button when you want the answer.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="mentor-matching-schedule-optimizer.js"></script>
</body>
</html>
