<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Student Growth to Portfolio Network</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Student Growth to Portfolio Network</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">5 stages · left to right</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#5B7186"></span>Raw observations</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>Growth metrics</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Mastery levels</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>Portfolio</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#8E7CC3"></span>Parent portal</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Stage Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any stage to see what flows into it and where that data goes next.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="student-growth-portfolio-network.js"></script>
</body>
</html>
