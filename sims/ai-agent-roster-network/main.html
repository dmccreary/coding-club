<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Meet the Club's AI Agent Roster</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Meet the Club's AI Agent Roster</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">6 agent types</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>The umbrella idea</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>Planning</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Communication</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#E8833A"></span>Registration</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#8E7CC3"></span>Scheduling</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#D64545"></span>Reminder</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#5B7186"></span>Mentor coaching</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Agent Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any agent to see the club task it handles and an example.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="ai-agent-roster-network.js"></script>
</body>
</html>
