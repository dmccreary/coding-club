<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Mentor Recruiting Influence Graph</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Mentor Recruiting Influence Graph</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">2 reached · 4 not reached</div>
                <button class="btn" id="spotlight-btn">Highest-leverage node</button>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#5B7186"></span>The club's current outreach</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Channel already reached</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>Channel not reached</div>
                <div class="legend-item"><span class="legend-color legend-note"></span>A dashed edge is a connection that does not exist yet</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Channel Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any channel for its population estimate and whether the club currently reaches it.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="mentor-recruiting-influence-graph.js"></script>
</body>
</html>
