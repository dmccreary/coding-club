<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Institutional Funding Partnership Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Institutional Funding Partnership Map</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">4 needs · 4 partners</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>An ongoing funding need</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>An institutional partner</div>
                <div class="legend-item"><span class="legend-color legend-note"></span>Every arrow reads "need is addressed by partner"</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Need and Partner Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any need or partner. The two nodes with more than one line are the ones worth looking at.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="institutional-funding-partnership-map.js"></script>
</body>
</html>
