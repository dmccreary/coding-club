<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Access Barrier to Fix Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Access Barrier to Fix Map</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">5 barriers · 7 fixes</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#D64545"></span>Barrier a family faces</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#3E9E6E"></span>Club practice that addresses it</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Barrier and Fix Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any barrier or fix to see what it is and what it addresses.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="access-barrier-to-fix-map.js"></script>
</body>
</html>
