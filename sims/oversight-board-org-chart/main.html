<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Oversight Board Org Chart</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vis-network/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="container">
        <div id="network"></div>

        <div class="title">Oversight Board Org Chart</div>

        <div class="right-panel">
            <div class="controls">
                <div class="stats">5 seats · 2 tiers below</div>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
            </div>

            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background-color:#5B7186"></span>Board and the people served</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#4A90D9"></span>Board seat</div>
                <div class="legend-item"><span class="legend-color" style="background-color:#F5A623"></span>Day-to-day operations</div>
            </div>

            <div class="info-panel">
                <div class="info-heading">Seat Details</div>
                <div id="info-content">
                    <p class="info-placeholder">Click any seat to see its core responsibility.</p>
                </div>
            </div>
        </div>
    </div>
</main>

    <script src="oversight-board-org-chart.js"></script>
</body>
</html>
