# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Coding Club'
site_description: 'An interactive intelligent textbook on how to create, organize, promote and run a sustainable coding club.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/coding-club/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/coding-club'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - "1. What Is a Coding Club": chapters/01-what-is-a-coding-club/index.md
      - "2. AI, Intelligent Textbooks, and Where Coding Clubs Meet": chapters/02-ai-and-intelligent-textbooks/index.md
      - "3. Writing Your Club Charter and Safety Policies": chapters/03-club-charter-and-safety/index.md
      - "4. Club Roles, Governance Structure, and Branding": chapters/04-roles-governance-branding/index.md
      - "5. Gauging Interest and Holding Your First Meeting": chapters/05-gauging-interest-first-meeting/index.md
      - "6. Growing, Branding, and Promoting Your Club": chapters/06-growing-and-promoting-club/index.md
      - "7. Telling Your Club's Story and Designing the Classroom": chapters/07-club-story-and-classroom-design/index.md
      - "8. Running a Session: Room Layout to Cleanup": chapters/08-running-a-session/index.md
      - "9. Mentors, Students, and the 3:1 Ratio": chapters/09-mentors-students-ratio/index.md
      - "10. Building Mentor-Student Relationships That Last": chapters/10-mentor-student-relationships/index.md
      - "11. Choosing a Schedule and Building Registration": chapters/11-schedule-and-registration/index.md
      - "12. Running Events and Learning From Retrospectives": chapters/12-events-and-retrospectives/index.md
      - "13. Special Events, Payments, and Term Wrap-Up": chapters/13-special-events-and-payments/index.md
      - "14. Computational Thinking, Scratch, and Python Basics": chapters/14-computational-thinking-scratch-python/index.md
      - "15. Designing a Curriculum With Challenge Cards and Portfolios": chapters/15-curriculum-challenge-cards/index.md
      - "16. Physical Computing and Electrical Safety Basics": chapters/16-physical-computing-safety/index.md
      - "17. Sensors, Displays, Motors, and Robot Chassis": chapters/17-sensors-displays-motors/index.md
      - "18. Robots, USB Basics, and Electronics Workshop Skills": chapters/18-robots-usb-electronics-workshop/index.md
      - "19. Raspberry Pi Pico, MicroPython, and the Moving Rainbow Kit": chapters/19-pico-micropython-moving-rainbow/index.md
      - "20. Sensor, Sound, and IoT Project Kits": chapters/20-sensor-sound-iot-kits/index.md
      - "21. Managing Your Kit Inventory and Signal Processing Kits": chapters/21-kit-inventory-signal-processing/index.md
      - "22. Purchasing and Configuring Club Devices": chapters/22-purchasing-configuring-devices/index.md
      - "23. Network, Peripherals, and the Device Lifecycle": chapters/23-network-peripherals-device-lifecycle/index.md
      - "24. Tracking Student Data and Managing Club Communication": chapters/24-student-data-and-communication/index.md
      - "25. Analyzing Club Data and Choosing the Right Tools": chapters/25-analyzing-club-data-and-tools/index.md
      - "26. Motivation, Badges, and Growth Mindset Coaching": chapters/26-motivation-badges-growth-mindset/index.md
      - "27. Encouraging Persistence and Student Voice": chapters/27-persistence-and-student-voice/index.md
      - "28. Reaching Underserved Communities and Removing Barriers": chapters/28-underserved-communities-barriers/index.md
      - "29. Building Trust and Representation in Your Club": chapters/29-trust-and-representation/index.md
      - "30. Budgeting, Fundraising, and Grant Writing": chapters/30-budgeting-fundraising-grants/index.md
      - "31. Tracking Expenses and Building Funding Partnerships": chapters/31-expenses-and-funding-partnerships/index.md
      - "32. AI Agents for Registration, Scheduling, and Communication": chapters/32-ai-agents-registration-scheduling/index.md
      - "33. AI-Customized Curriculum and Rolling Out New Agents": chapters/33-ai-customized-curriculum-rollout/index.md
      - "34. Establishing an Oversight Board and Inventory System": chapters/34-oversight-board-and-inventory/index.md
      - "35. Training Mentors and Building a Club That Outlasts You": chapters/35-training-mentors-and-succession/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Test Page: learning-graph/mascot-test.md
      - Book Metrics: learning-graph/book-metrics.md
      - Chapter Metrics: learning-graph/chapter-metrics.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - Challenge Cards:
      - Card Gallery: cards/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Coding Club'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
